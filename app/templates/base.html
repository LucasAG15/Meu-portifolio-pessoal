<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Meu Portfólio{% endblock %}</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Fonte moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ================= HEADER ================= -->
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <a href="{{ url_for('main.index') }}">MeuPortfólio</a>
            </div>

            <ul class="nav-links">
                <li><a href="{{ url_for('main.index') }}">Início</a></li>
                <li><a href="{{ url_for('main.projetos') }}">Projetos Python</a></li>
                <li><a href="{{ url_for('main.contato') }}">Projetos C</a></li>
            </ul>
        </nav>
    </header>

    <!-- ================= CONTEÚDO ================= -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="footer">
        <p>© 2026 • Desenvolvido por você • Todos os direitos reservados</p>
    </footer>

    <!-- JS principal -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
